stages:
  - lint
  - build
  - test
  - e2e

# Lint the client.
lint-client:
  stage: lint
  image: node:22
  script:
    - cd client
    - npm ci
    - npm run lint

# Build the client's production bundle.
build-client:
  stage: build
  image: node:22
  script:
    - cd client
    - npm ci
    - npm run build

# Lint the server. Runs in parallel with lint-client.
lint-server:
  stage: lint
  image: node:22
  script:
    - cd server
    - npm ci
    - npm run lint

# Compile the server. Fails if the TypeScript doesn't type-check.
build-server:
  stage: build
  image: node:22
  script:
    - cd server
    - npm ci
    - npm run build

test-server:
  stage: test
  image: node:22
  # A PostgreSQL container runs alongside this job, reachable as "postgres".
  services:
    - name: postgres:16
  variables:
    # These configure the postgres service container on startup...
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app_pw
    POSTGRES_DB: app_test_db
    # ...and these tell the tests where to find it. PGHOST is "postgres",
    # the service's hostname, NOT localhost.
    PGHOST: postgres
    PGPORT: "5432"
    PGUSER: app
    PGPASSWORD: app_pw
    PGDATABASE: app_test_db
  script:
    # The service creates the database but does NOT load our schema, so we
    # load it ourselves before the tests run.
    - apt-get update && apt-get install -y postgresql-client
    - psql -h postgres -U app -d app_test_db -f db/init/001-schema.sql
    - cd server
    - npm ci
    - npm test

test-e2e:
  stage: e2e
  # This image ships with browsers preinstalled; Playwright needs one.
  # The tag matches the @playwright/test version in client/package-lock.json.
  image: mcr.microsoft.com/playwright:v1.64.0-noble
  services:
    - name: postgres:16
  variables:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app_pw
    POSTGRES_DB: app_db
    PGHOST: postgres
    PGPORT: "5432"
    PGUSER: app
    PGPASSWORD: app_pw
    PGDATABASE: app_db
    # Point the E2E tests at the served client (the tests never change,
    # only this URL does).
    E2E_BASE_URL: "http://localhost:4173"
  script:
    - apt-get update && apt-get install -y postgresql-client
    - psql -h postgres -U app -d app_db -f db/init/001-schema.sql
    # Start the server in the background against the database.
    - cd server && npm ci
    - npm run start:ci &
    # Build and serve the client in the background.
    - cd ../client && npm ci
    - npm run build
    - npx vite preview --port 4173 --host &
    # Give both a moment to come up, then run the browser tests.
    - sleep 5
    - npx playwright test
