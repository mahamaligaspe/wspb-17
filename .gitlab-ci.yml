stages:
  - lint and build
  - integration tests
  - e2e tests
  - publish
  - deploy

# Lint the client.
lint-client:
  stage: lint and build
  image: node:22
  script:
    - cd client
    - npm ci
    - npm run lint

# Build the client's production bundle.
build-client:
  stage: lint and build
  image: node:22
  script:
    - cd client
    - npm ci
    - npm run build

# Lint the server. Runs in parallel with lint-client.
lint-server:
  stage: lint and build
  image: node:22
  script:
    - cd server
    - npm ci
    - npm run lint

# Compile the server. Fails if the TypeScript doesn't type-check.
build-server:
  stage: lint and build
  image: node:22
  script:
    - cd server
    - npm ci
    - npm run build

test-server:
  stage: integration tests
  image: node:22
  # A PostgreSQL container runs alongside this job, reachable as "postgres".
  services:
    - name: postgres:16
  variables:
    # These configure the postgres service container on startup...
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app_pw
    POSTGRES_DB: app_test_db
    # ...and these tell the tests where to find it. PGHOST is "postgres",
    # the service's hostname, NOT localhost.
    PGHOST: postgres
    PGPORT: "5432"
    PGUSER: app
    PGPASSWORD: app_pw
    PGDATABASE: app_test_db
  script:
    # The service creates the database but does NOT load our schema, so we
    # load it ourselves before the tests run.
    - apt-get update && apt-get install -y postgresql-client
    - psql -h postgres -U app -d app_test_db -f db/init/001-schema.sql
    - cd server
    - npm ci
    - npm test

test-e2e:
  stage: e2e tests
  # This image ships with browsers preinstalled; Playwright needs one.
  # The tag matches the @playwright/test version in client/package-lock.json.
  image: mcr.microsoft.com/playwright:v1.64.0-noble
  services:
    - name: postgres:16
  variables:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app_pw
    POSTGRES_DB: app_db
    PGHOST: postgres
    PGPORT: "5432"
    PGUSER: app
    PGPASSWORD: app_pw
    PGDATABASE: app_db
    # Point the E2E tests at the served client (the tests never change,
    # only this URL does).
    E2E_BASE_URL: "http://localhost:4173"
  script:
    - apt-get update && apt-get install -y postgresql-client
    - psql -h postgres -U app -d app_db -f db/init/001-schema.sql
    # Start the server in the background against the database.
    - cd server && npm ci
    - npm run start:ci &
    # Build and serve the client in the background.
    - cd ../client && npm ci
    - npm run build
    - npx vite preview --port 4173 --host &
    # Give both a moment to come up, then run the browser tests.
    - sleep 5
    - npx playwright test

# Build the server image, tag it two durable ways, and push to the registry.
publish-server:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  rules:
    # Only publish from the default branch. Feature branches verify (lint/test);
    # they do not produce published artifacts. Artifacts come from main.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    # This project's registry path, with /server on the end.
    IMAGE: $CI_REGISTRY_IMAGE/server
  before_script:
    # docker:27 has the Docker CLI only, no Node - needed for `node -p` below.
    - apk add --no-cache nodejs
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    # Build ONCE. This single image is the artifact everything below points at.
    - docker build -t "$IMAGE:$CI_COMMIT_SHORT_SHA" server
    # Second tag on the SAME image: the semantic version from package.json.
    - VERSION=$(node -p "require('./server/package.json').version")
    - docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:$VERSION"
    # Two names, one image, one digest.
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE:$VERSION"

# Same shape as publish-server: build context is client/, version is 0.0.0.
publish-client:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/client
  before_script:
    # docker:27 has no Node - install it for the `node -p` version read below.
    - apk add --no-cache nodejs
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build -t "$IMAGE:$CI_COMMIT_SHORT_SHA" client
    - VERSION=$(node -p "require('./client/package.json').version")
    - docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:$VERSION"
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE:$VERSION"

# Deploy the JUST-PUBLISHED images to the staging VM via SSH.
# There is no `docker build` here - deployment moves and starts the artifact,
# it never rebuilds it. The runner is on campus, so it reaches the VM directly.
deploy-staging:
  stage: deploy
  image: docker:27
  # Only from main, and only after the publish jobs succeeded.
  needs:
    - publish-server
    - publish-client
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: staging
    url: http://$REMOTE_SERVER
  before_script:
    # The runner image is minimal; add SSH and rsync.
    - apk add --no-cache openssh-client rsync
  script:
    # 1. Set up SSH as the deploy user (key comes in base64-encoded).
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$DEPLOY_KEY_PRIVATE" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$REMOTE_SERVER" >> ~/.ssh/known_hosts
    # 2. Assemble the stack: the compose file + a generated .env that names
    #    the EXACT images published this run, plus the runtime API_URL.
    - mkdir -p stage_stack/db
    - cp docker-compose.staging.yml stage_stack/docker-compose.yml
    # Ship the schema so Postgres seeds it on first boot (initdb.d mount).
    - cp db/init/001-schema.sql stage_stack/db/001-staging-schema.sql
    - echo "SERVER_IMAGE=$CI_REGISTRY_IMAGE/server:$CI_COMMIT_SHORT_SHA" >  stage_stack/.env
    - echo "CLIENT_IMAGE=$CI_REGISTRY_IMAGE/client:$CI_COMMIT_SHORT_SHA" >> stage_stack/.env
    - echo "API_URL=http://$REMOTE_SERVER:3001"                          >> stage_stack/.env
    # Source vars are STAGING_PG* so they don't collide with the test jobs'
    # PG* - written into .env as the PG* names the stack expects.
    - echo "PGUSER=$STAGING_PGUSER"                                      >> stage_stack/.env
    - echo "PGPASSWORD=$STAGING_PGPASSWORD"                              >> stage_stack/.env
    - echo "PGDATABASE=$STAGING_PGDATABASE"                              >> stage_stack/.env
    # 3. Ship the stack to the deploy user's home on the VM.
    - rsync -r stage_stack "$REMOTE_USER@$REMOTE_SERVER:./"
    # 4. Start it on the server: log in to the registry with the job's own
    #    token, pull, up -d.
    - |
      ssh "$REMOTE_USER@$REMOTE_SERVER" "
        docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY &&
        cd stage_stack &&
        docker compose pull &&
        docker compose up -d
      "
